{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Username <input name="username" required minlength="3" maxlength="32" autocomplete="username"></label>
  <label>Password (10+ characters) <input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
  <button type="submit">Create account</button>
</form>
{% endblock %}
