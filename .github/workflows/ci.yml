name: CI

# Runs on the secure branch. The 'vulnerable' branch is intentionally insecure,
# so it is deliberately not gated here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit & security regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q

      - name: Static security scan (Bandit)
        run: bandit -r portal -q

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt
